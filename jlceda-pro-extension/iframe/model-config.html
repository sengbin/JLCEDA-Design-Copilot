<!doctype html>
<html lang="zh-Hans">

<head>
	<title>设置</title>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<link rel="stylesheet" href="/iframe/overlayscrollbars.css" />
	<link rel="stylesheet" href="/iframe/model-config.css" />
	<link rel="stylesheet" href="/iframe/common.css" />
</head>

<body class="page-loading">
	<div class="page-loading-mask" role="status" aria-live="polite" aria-label="页面加载中">
		<span class="page-loading-spinner" aria-hidden="true"></span>
		<span class="page-loading-text">载入中...</span>
	</div>
	<div class="page">
		<div class="panel">
			<div class="config-layout">
				<div class="left-menu" aria-label="配置菜单">
					<button class="left-menu-item is-active" type="button" data-menu="model-config">模型配置</button>
					<button class="left-menu-item" type="button" data-menu="instructions-config">自定义指令</button>
				</div>

				<div class="content-area">
					<div class="content-panel is-active" data-menu-panel="model-config">
						<div class="tutorial-link-row">
							<span class="tutorial-link-label">演示视频（B站链接）</span>
							<a class="tutorial-link-anchor" href="https://www.bilibili.com/video/BV1uwwXzSEpU/"
								target="_blank"
								rel="noopener noreferrer">https://www.bilibili.com/video/BV1uwwXzSEpU/</a>
						</div>

						<div class="important-tip" role="note"><span
								class="important-tip-title">重要提示：</span>请先在对应平台完成<span
								class="important-tip-highlight">充值</span>，再在此配置模型，否则可能因余额不足导致验证失败。</div>

						<div class="platform-config-block">
							<div class="tab-row" role="tablist" aria-label="平台选择"></div>

							<div class="platform-panels"></div>
						</div>

						<div class="bottom-row">
							<div id="notes" class="notes-display">注意事项：请填写各平台 API Key 与模型名称，验证通过后点击“保存”。</div>

							<div class="button-row">
								<button id="verifyBtn" class="button button-outline" type="button">验证配置</button>
								<button id="saveBtn" class="button button-primary" type="button">保存</button>
								<button id="closeBtn" class="button button-danger" type="button">关闭</button>
							</div>
						</div>
					</div>

					<div class="content-panel instructions-panel" data-menu-panel="instructions-config" hidden>
						<div class="instructions-example" role="note">
							<div class="instructions-example-title">设置示例</div>
							<div class="instructions-example-text">
								<p>请按“目标、约束、输出格式”书写。</p>
								<p>目标：优先给出可直接执行的EDA操作步骤。</p>
								<p>约束：仅输出中文，禁止虚构接口。</p>
								<p>输出格式：按1、2、3分步列出。</p>
							</div>
						</div>

						<div class="instructions-textarea-scroll">
							<div id="instructionsEditor" class="input instructions-editor" contenteditable="plaintext-only"
								role="textbox" aria-multiline="true" data-placeholder="请输入指令"></div>
						</div>

						<div class="instructions-backup-tip">建议点击下面的保存到本地按钮手动备份指令文本。</div>

						<div class="bottom-row instructions-bottom-row">
							<div class="button-row instructions-local-button-row">
								<button id="instructionsExportBtn" class="button" type="button">保存到本地</button>
								<button id="instructionsImportBtn" class="button" type="button">从本地上传</button>
							</div>
							<div class="button-row instructions-button-row">
								<button id="instructionsSaveBtn" class="button button-primary" type="button">修改</button>
								<button id="instructionsCancelBtn" class="button button-danger" type="button">关闭</button>
							</div>
							<input id="instructionsImportInput" class="instructions-file-input" type="file"
								accept=".txt,.md,.prompt" />
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>

	<script src="/dist/iframe/config.js"></script>
</body>

</html>
