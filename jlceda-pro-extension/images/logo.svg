<svg width="1024" height="1024" viewBox="112 112 800 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 3-stop 渐变：深靛青 → 紫 → 青绿，更丰富的层次 -->
    <linearGradient id="bgGrad" x1="112" y1="112" x2="912" y2="912" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3730A3"/>
      <stop offset="0.47" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#0891B2"/>
    </linearGradient>
    <!-- AI 标记渐变与背景同色系 -->
    <linearGradient id="aiGrad" x1="420" y1="400" x2="660" y2="612" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4338CA"/>
      <stop offset="1" stop-color="#0891B2"/>
    </linearGradient>
    <!-- 背景矩形顶部玻璃反光 -->
    <linearGradient id="glassSheen" x1="512" y1="112" x2="512" y2="660" gradientUnits="userSpaceOnUse">
      <stop stop-color="white" stop-opacity="0.17"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <!-- 中心光晕：多段更细腻 -->
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
                    gradientTransform="translate(512 512) rotate(90) scale(360)">
      <stop stop-color="white" stop-opacity="0.20"/>
      <stop offset="0.58" stop-color="white" stop-opacity="0.07"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </radialGradient>
    <!-- 角落星光柔化光晕 -->
    <filter id="sparkleGlow" x="-150%" y="-150%" width="400%" height="400%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="13"/>
    </filter>
    <!-- 气泡立体投影 -->
    <filter id="bubbleShadow" x="-8%" y="-5%" width="116%" height="118%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="8" stdDeviation="20" flood-color="#1E1B4B" flood-opacity="0.20"/>
    </filter>
  </defs>

  <!-- 背景圆角矩形 -->
  <rect x="112" y="112" width="800" height="800" rx="220" fill="url(#bgGrad)"/>
  <!-- 玻璃反光叠层 -->
  <rect x="112" y="112" width="800" height="800" rx="220" fill="url(#glassSheen)"/>
  <!-- 白色描边高光，增加层次感 -->
  <rect x="113.5" y="113.5" width="797" height="797" rx="219" stroke="white" stroke-opacity="0.12" stroke-width="3" fill="none"/>

  <!-- 中心径向光晕 -->
  <circle cx="512" cy="512" r="340" fill="url(#halo)"/>

  <!-- 角落星光：柔化底层 -->
  <g filter="url(#sparkleGlow)" opacity="0.72">
    <circle cx="272" cy="300" r="10" fill="white"/>
    <circle cx="752" cy="280" r="10" fill="white"/>
    <circle cx="796" cy="706" r="10" fill="white"/>
    <circle cx="240" cy="732" r="10" fill="white"/>
  </g>
  <!-- 角落星光：十字锐利笔画 -->
  <g opacity="0.92">
    <path d="M272 288 L272 312 M260 300 L284 300" stroke="white" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M752 268 L752 292 M740 280 L764 280" stroke="white" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M796 694 L796 718 M784 706 L808 706" stroke="white" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M240 720 L240 744 M228 732 L252 732" stroke="white" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- 对话气泡（带立体投影） -->
  <path filter="url(#bubbleShadow)"
    d="M346 328H678C719.974 328 754 362.026 754 404V578C754 619.974 719.974 654 678 654H522L404 748C387.461 761.174 362 749.398 362 728V654H346C304.026 654 270 619.974 270 578V404C270 362.026 304.026 328 346 328Z"
    fill="white"/>

  <!-- AI 标记：A 字形 -->
  <path d="M434 590L512 424L590 590" stroke="url(#aiGrad)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- A 中横线 -->
  <path d="M468 526H556" stroke="url(#aiGrad)" stroke-width="36" stroke-linecap="round"/>
  <!-- i 圆点 -->
  <circle cx="642" cy="454" r="21" fill="url(#aiGrad)"/>
  <!-- i：电容符号（上引线 + 双平行极板 + 下引线） -->
  <path d="M642 481 L642 514" stroke="url(#aiGrad)" stroke-width="18" stroke-linecap="round"/>
  <path d="M608 522 L676 522" stroke="url(#aiGrad)" stroke-width="15" stroke-linecap="round"/>
  <path d="M608 540 L676 540" stroke="url(#aiGrad)" stroke-width="15" stroke-linecap="round"/>
  <path d="M642 548 L642 590" stroke="url(#aiGrad)" stroke-width="18" stroke-linecap="round"/>

  <!-- 角落装饰斜线 -->
  <path d="M232 362L278 398" stroke="white" stroke-opacity="0.55" stroke-width="11" stroke-linecap="round"/>
  <path d="M746 238L700 274" stroke="white" stroke-opacity="0.55" stroke-width="11" stroke-linecap="round"/>
  <path d="M804 646L758 610" stroke="white" stroke-opacity="0.55" stroke-width="11" stroke-linecap="round"/>
  <path d="M278 742L232 706" stroke="white" stroke-opacity="0.55" stroke-width="11" stroke-linecap="round"/>
</svg>
